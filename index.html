<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b12">
  <title>Eilune Codex</title>
  <meta name="description" content="A living player-facing archive of Eilune lore.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Eilune Codex home">
      <span class="brand-mark">✦</span>
      <span><strong>EILUNE</strong><small>CODEX</small></span>
    </a>
    <nav class="topnav" aria-label="Primary navigation"></nav>
    <button class="search-button" id="searchButton" type="button" aria-label="Search the Codex">
      <span>⌕</span><span class="search-label">Search</span><kbd>/</kbd>
    </button>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading"><span id="sidebarCategory">Codex</span><button id="sidebarClose" aria-label="Close navigation">×</button></div>
      <div class="sidebar-scroll" id="sidebarContent"></div>
    </aside>
    <main class="main" id="app" tabindex="-1"></main>
  </div>

  <nav class="mobile-nav" aria-label="Mobile navigation"></nav>

  <dialog class="search-dialog" id="searchDialog">
    <form method="dialog" class="search-panel" id="searchForm">
      <div class="search-input-row">
        <span class="search-glyph">⌕</span>
        <input id="searchInput" type="search" placeholder="Search people, places, lore…" autocomplete="off" aria-label="Search">
        <button value="cancel" aria-label="Close search">Esc</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
